name: Django CI with Poetry

on:
  push:
    branches:
      - task_2
  pull_request:
    branches:
      - task_2

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_user -d test_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      SECRET_KEY: test-secret-key
      NAME: test_db
      USER: test_user
      PASSWORD: test_password
      HOST: localhost
      PORT: 5432
      DEBUG: "True"

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: poetry install --no-root

      - name: Run migrations
        run: poetry run python manage.py migrate

      - name: Run tests
        run: poetry run python manage.py test

  lint:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: poetry install --no-root

      - name: Run Flake8
        run: poetry run flake8 .

  build:
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build application image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/drf-habits:latest .

      - name: Push application image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/drf-habits:latest

      - name: Build nginx image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/drf-habits-nginx:latest ./nginx

      - name: Push nginx image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/drf-habits-nginx:latest

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/task_2'
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to Server
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          
            cd ~/course_drf_habits
          
            git pull origin task_2
          
            docker compose -f docker-compose.prod.yaml pull
          
            docker compose -f docker-compose.prod.yaml up -d
          
            docker compose -f docker-compose.prod.yaml ps
          
          EOF
